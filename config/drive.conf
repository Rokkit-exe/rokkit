# Rokkit Drive Mount Configuration
#
# Configure your drive to be mounted automatically
# Lines starting with # are comments and will be ignored
# Empty lines are ignored
#
# Format: KEY=VALUE (no spaces around =)
#
# Required fields:
#   UUID         - Drive UUID (find with: lsblk -f or blkid)
#   MOUNT_POINT  - Where to mount the drive (e.g., /mnt/storage)
#   FILESYSTEM   - Filesystem type (e.g., ext4, ntfs, btrfs)
#
# Optional fields:
#   MOUNT_OPTIONS - Mount options (default: defaults,nofail)
#   DEVICE_LABEL  - Friendly name for the drive (for display only)

# Example configuration:
UUID=1aa44f69-7eed-4464-9b6f-8a847f9b8366
MOUNT_POINT=/mnt/storage
FILESYSTEM=ext4
MOUNT_OPTIONS=defaults,nofail
DEVICE_LABEL=Storage Drive
